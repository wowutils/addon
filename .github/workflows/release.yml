name: Release

# Existing tags are unprefixed (1.0.7, 0.0.8beta), so match on a leading digit
# rather than the more common 'v*'.
on:
  push:
    tags:
      - '[0-9]*'

# Required: default workflow permissions are read-only on most repos, and the
# packager needs write access to create the release and attach the zip.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags, so the packager can resolve the version and
          # generate a changelog.
          fetch-depth: 0

      - name: Package and publish
        uses: BigWigsMods/packager@v2
        env:
          # Provided automatically by Actions - nothing to configure.
          # Note the name: the packager reads GITHUB_OAUTH, not GITHUB_TOKEN.
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # Both optional. If the secret is unset the packager logs a warning
          # and skips that site; it does not fail the build.
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
